name: CI

on:
  pull_request:

jobs:
  wrapper-tests:
    # Plain bash + ruby tests of the wrapper text the formulae generate; no
    # tap or install needed. macOS runs them under /bin/bash 3.2, as the
    # installed wrapper runs there.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: wheels-be docs mirror
        env:
          BASH_BIN: ${{ runner.os == 'macOS' && '/bin/bash' || '' }}
        run: bash tests/wheels-be-docs-mirror.sh

      - name: module sync replaces the installed copy
        env:
          BASH_BIN: ${{ runner.os == 'macOS' && '/bin/bash' || '' }}
        run: bash tests/module-sync.sh

  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tap this repo
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/wheels-dev"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/wheels-dev/homebrew-wheels"
          # Homebrew 6.0+ requires explicit trust before audit/install from a
          # third-party tap. See bleeding-edge-update.yml for the full rationale.
          brew trust wheels-dev/wheels

      - name: Audit formula
        run: brew audit --strict wheels

      - name: Install formula
        run: brew install wheels

      - name: Test formula
        run: brew test wheels
